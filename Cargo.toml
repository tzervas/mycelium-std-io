[package]
name = "mycelium-std-io"
version.workspace = true
description = "std.io + serialize + pure JSON/TOML codecs — single-consumption IO + canonical serialization."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "3958d2ea3c3921611e33f1f00e3469b29a939a76" }
mycelium-std-core = { git = "https://github.com/tzervas/mycelium-std-core", rev = "f530c3db59a35fbb5769356555bda09997e96a1f" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
# property tests for the round-trip bound; MSRV 1.96.1-compatible (ADR-041)
proptest = "1"

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-std-io"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure config codec (S-CODECS / WP-5); MIT OR Apache-2.0 — deny.toml allow-list.
toml = { version = "0.8", default-features = true }
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
