[package]
name = "mycelium-std-io"
version.workspace = true
description = "std.io + serialize + pure JSON/TOML codecs — single-consumption IO + canonical serialization."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "57ef45b453eef1f02bdfb1f0cad1034dabd32b1f" }
mycelium-std-core = { git = "https://github.com/tzervas/mycelium-std-core", rev = "19398dfd847eb9a5fc518149a714d7646abbb316" }
# S-STD-IO-TYPED-PRIMS (PKG-LINKAGE, mycelium-lang#44): the checked `prim:` dispatch schema/
# registry (PrimSig/TySpec/TypedPrimRegistry — mycelium-runtime src/typed.rs, landed via
# mycelium-runtime#18 + the PrimSig.name/TySpec::Float correction #19). Optional — only pulled in
# by the `typed-prims` feature below; mirrors the exact host-registry/net-host optional-dep
# precedent already used by mycelium-std-net/mycelium-std-sys-host's Cargo.toml, and the same
# `mycelium-interp` git dependency shape mycelium-l1's Cargo.toml already uses to reach this crate.
mycelium-interp = { git = "https://github.com/tzervas/mycelium-runtime", rev = "ac883d2ca0f8da90dddd32ddd6385db58674e635", optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[features]
# S-STD-IO-TYPED-PRIMS: exposes `typed_prims::typed_prim_sigs()` / `typed_prims::install_typed_prims()`
# registering to_json/from_json/serialize/deserialize as checked `prim:` entries. Off by default —
# a default build never links mycelium-interp (or its transitive mycelium-value/mycelium-sched
# closure), zero-diff for every existing consumer.
typed-prims = ["dep:mycelium-interp"]

[dev-dependencies]
# property tests for the round-trip bound; MSRV 1.96.1-compatible (ADR-041)
proptest = "1"

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-std-io"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure config codec (S-CODECS / WP-5); MIT OR Apache-2.0 — deny.toml allow-list.
toml = { version = "0.8", default-features = true }
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
